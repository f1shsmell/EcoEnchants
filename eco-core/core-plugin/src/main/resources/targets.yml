# These are extra items that cannot normally be enchanted in an enchanting table,
# add items to this list to be able to enchant them.

extra-enchantable-items:
  - "*elytra"
  - "*shield"
  - "*flint_and_steel"
  - "*shears"
  - "*carrot_on_a_stick"
  - "*player_head"

# A target consists of items and a slot.

# The options for slot are mainhand, offhand, hands, helmet, chestplate,
# leggings, boots, armor, any, a number from 0-40 (to specify an exact slot),
# or a list of slots like "9, 10, 11, mainhand"

# The slot defines when the enchantment will activate, for example if you have
# a target with slot "mainhand", the enchantment will activate whenever the item is
# in your mainhand.

targets:
  - id: pickaxe
    display-name: "镐"
    slot: mainhand
    items:
      - "#items_pickaxes"

  - id: axe
    display-name: "斧"
    slot: mainhand
    items:
      - "#items_axes"

  - id: hoe
    display-name: "锄"
    slot: mainhand
    items:
      - "#items_hoes"

  - id: shovel
    display-name: "锹"
    slot: mainhand
    items:
      - "#items_shovels"

  - id: sword
    display-name: "剑"
    slot: mainhand
    items:
      - "#items_swords"

  - id: spear
    display-name: "矛"
    slot: mainhand
    items:
      - "#items_spears"

  - id: helmet
    display-name: "头盔"
    slot: armor
    items:
      - "#items_head_armor"

  - id: chestplate
    display-name: "胸甲"
    slot: armor
    items:
      - "#items_chest_armor"

  - id: leggings
    display-name: "护腿"
    slot: armor
    items:
      - "#items_leg_armor"

  - id: boots
    display-name: "靴子"
    slot: armor
    items:
      - "#items_foot_armor"

  - id: armor
    display-name: "盔甲"
    slot: armor
    items:
      - "#items_head_armor"
      - "#items_chest_armor"
      - "#items_leg_armor"
      - "#items_foot_armor"

  - id: trident
    display-name: "三叉戟"
    slot: mainhand
    items:
      - "*trident"

  - id: bow
    display-name: "弓"
    slot: mainhand
    items:
      - "*bow"

  - id: crossbow
    display-name: "弩"
    slot: mainhand
    items:
      - "*crossbow"

  - id: shears
    display-name: "剪刀"
    slot: mainhand
    items:
      - "*shears"

  - id: shield
    display-name: "盾牌"
    slot: hands
    items:
      - "*shield"

  - id: fishing_rod
    display-name: "钓鱼竿"
    slot: mainhand
    items:
      - "*fishing_rod"

  - id: flint_and_steel
    display-name: "打火石"
    slot: mainhand
    items:
      - "*flint_and_steel"

  - id: carrot_on_a_stick
    display-name: "胡萝卜钓竿"
    slot: mainhand
    items:
      - "*carrot_on_a_stick"

  - id: elytra
    display-name: "鞘翅"
    slot: armor
    items:
      - "*elytra"

  - id: mace
    display-name: "重锤"
    slot: mainhand
    items:
      - "*mace"
