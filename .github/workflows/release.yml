name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        # Same limits as build.yml: paperweight-userdev setups for the 7 NMS
        # modules OOM-kill the Gradle daemon on 16GB runners when run in parallel.
        run: ./gradlew build libreforgeJar --full-stacktrace --max-workers=2
      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "bin/EcoEnchants v${version}.jar" "EcoEnchants-${version}.jar"
          gh release create "$GITHUB_REF_NAME" "EcoEnchants-${version}.jar" \
            --title "EcoEnchants ${version} (unofficial community build)" \
            --notes-file .github/release-notes.md
